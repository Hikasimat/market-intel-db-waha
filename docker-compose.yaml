services:
  waha-noweb-light:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waha-noweb-light
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - WAHA_API_KEY=waha_secure_api_key_2026
      - WAHA_LOG_LEVEL=info
      - WAHA_LOG_FORMAT=JSON
      - WHATSAPP_HOOK_URL=http://host.docker.internal:8000/api/whatsapp/webhook/
      # '*' ensures ALL events (auth.qr, auth.pairing_code, session.*, message.*, group.*) are dispatched
      - WHATSAPP_HOOK_EVENTS=*
      # Cryptographic secret for tamper-proof HMAC-SHA512 & HMAC-SHA256 signatures
      - WHATSAPP_HOOK_SECRET=waha_super_secret_hmac_key_2026
      # Auto-start default session on boot so QR code is immediately pushed via webhook
      - WHATSAPP_START_SESSION=default
      # HTTP Basic Auth credentials for UI Dashboard (prevents unauthorized browser access)
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=waha_secure_api_key_2026
      # Live WhatsApp Voice Calling Integration
      - CALLING_ENABLED=true
      - WACALLS_INTERNAL_URL=http://wacalls:8080
      - WACALLS_INTERNAL_TOKEN=wacalls_internal_secret_2026
    depends_on:
      - wacalls
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

  wacalls:
    build:
      context: ./wacalls-service
      dockerfile: Dockerfile
    container_name: wacalls-service
    restart: unless-stopped
    command: ["/app/wacalls", "-addr", ":8080", "-db", "/data/wacalls.db", "-debug"]
    expose:
      - "8080"
    environment:
      - WACALLS_INTERNAL_TOKEN=wacalls_internal_secret_2026
    volumes:
      - wacalls_data:/data

volumes:
  waha_sessions:
  waha_media:
  wacalls_data:
