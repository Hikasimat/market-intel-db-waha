# Nginx reverse proxy configuration for WAHA-NoWeb-Light on AWS EC2
# Place in /etc/nginx/sites-available/waha.conf

server {
    listen 80;
    server_name waha.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name waha.yourdomain.com;

    # SSL Certificate (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/waha.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waha.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Client body limit for media uploads (images, audio, PDF)
    client_max_body_size 60M;

    # Reverse proxy to WAHA container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time SSE stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
