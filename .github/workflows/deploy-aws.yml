name: Build and Auto-Deploy WAHA-NoWeb-Light to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting the JWT token from GitHub OIDC
  contents: read    # Required to checkout the repository

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }} # Change to your preferred AWS region (e.g. ap-south-1 for Mumbai, us-east-1, eu-central-1)
  ECR_REPOSITORY: waha-noweb-light
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_ARN }} # e.g. arn:aws:iam::123456789012:role/GitHubActions-WAHA-Deployer

jobs:
  build-and-push:
    name: Build & Push Image to Amazon ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC (No Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Auto-Deploy to EC2 via AWS SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.EC2_INSTANCE_ID != ''

    steps:
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR (to get registry URL)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Execute Zero-SSH Deployment via AWS Systems Manager (SSM)
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "Deploying image: $IMAGE_URI to EC2: ${{ env.EC2_INSTANCE_ID }}"

          COMMANDS=$(cat << 'EOF'
          set -e
          echo "Starting deployment..."
          cd /home/ubuntu/waha-noweb-light || cd /opt/waha-noweb-light

          # Login to ECR on the EC2 host
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

          # Pull latest image
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

          # Update running container with zero downtime
          docker compose -f docker-compose.prod.yaml up -d --force-recreate

          # Clean up dangling images
          docker image prune -f
          echo "Deployment completed successfully!"
          EOF
          )

          # Send Command via AWS SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(echo "$COMMANDS" | jq -R -s -c .)]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched: $COMMAND_ID"

          # Wait for command completion
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

          # Print execution output
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text)

          echo "=== EC2 Execution Logs ==="
          echo "$OUTPUT"
