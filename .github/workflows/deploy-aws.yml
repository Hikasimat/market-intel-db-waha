name: Build and Auto-Deploy WAHA-NoWeb-Light to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting the JWT token from GitHub OIDC
  contents: read    # Required to checkout the repository

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }} # Change to your preferred AWS region (e.g. ap-south-1 for Mumbai, us-east-1, eu-central-1)
  ECR_REPOSITORY: waha-noweb-light
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_ARN }} # e.g. arn:aws:iam::123456789012:role/GitHubActions-WAHA-Deployer

jobs:
  build-and-push:
    name: Build & Push Image to Amazon ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Environment Variables & Inspect OIDC Token
        run: |
          echo "AWS Region: ${{ env.AWS_REGION }}"
          echo "Role to Assume: ${{ env.ROLE_TO_ASSUME }}"
          if [ -z "${{ env.ROLE_TO_ASSUME }}" ]; then
            echo "❌ ERROR: ROLE_TO_ASSUME is empty! Make sure AWS_ROLE_ARN is configured in GitHub repository variables."
            exit 1
          fi

          TOKEN=$(curl -sLS -H "User-Agent: actions/runner" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value' 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then
            echo "=== OIDC Token Claims (sent by GitHub) ==="
            echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref}' 2>/dev/null || true
          fi

      - name: Authenticate to AWS via OIDC (No Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        run: |
          echo "Checking if ECR repository '${{ env.ECR_REPOSITORY }}' exists in region '${{ env.AWS_REGION }}'..."
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true

          # Enforce Free Tier compliance: Retain only 5 latest images to keep storage below 500MB
          aws ecr put-lifecycle-policy \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Retain last 5 images for Free Tier","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' || true

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Auto-Deploy to EC2 via AWS SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.EC2_INSTANCE_ID != ''

    steps:
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR (to get registry URL)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Execute Zero-SSH Deployment via AWS Systems Manager (SSM)
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})

          echo "Dispatching deployment for $IMAGE_URI to EC2: ${{ env.EC2_INSTANCE_ID }}"

          # Prepare clean deployment script
          cat << 'SCRIPT_EOF' > /tmp/deploy.sh
#!/bin/bash
set -e
echo "=== Starting Autonomous WAHA EC2 Deployment ==="

# 1. Install Docker if not present
if ! command -v docker > /dev/null 2>&1; then
  echo "Docker not detected. Installing Docker engine..."
  curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  sh /tmp/get-docker.sh
  systemctl enable --now docker
  usermod -aG docker ubuntu || true
fi

# 2. Install Docker Compose plugin if missing
if ! docker compose version > /dev/null 2>&1; then
  echo "Installing Docker Compose plugin..."
  apt-get update -y && apt-get install -y docker-compose-plugin || true
fi

# 3. Create deployment workspace
mkdir -p /home/ubuntu/waha-noweb-light
cd /home/ubuntu/waha-noweb-light

# 4. Authenticate to Amazon ECR
echo "__ECR_PASSWORD__" | docker login --username AWS --password-stdin "__REGISTRY__"

# 5. Pull latest container image
echo "Pulling Docker image: __IMAGE_URI__"
docker pull "__IMAGE_URI__"

# 6. Generate production docker-compose.prod.yaml
cat << 'COMPOSE_EOF' > docker-compose.prod.yaml
services:
  waha-noweb-light:
    image: __IMAGE_URI__
    container_name: waha-noweb-light
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WAHA_LOG_LEVEL=info
      - WAHA_PRINT_QR=true
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=waha_secure_api_key_2026
      - WAHA_WEBHOOK_URL=http://localhost:8000/api/whatsapp/webhook/
      - WAHA_WEBHOOK_SECRET=waha_secure_webhook_secret_2026
    volumes:
      - waha_prod_sessions:/app/.sessions
      - waha_prod_media:/app/.media
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  waha_prod_sessions:
    name: waha_prod_sessions
  waha_prod_media:
    name: waha_prod_media
COMPOSE_EOF

# 7. Start/recreate container
echo "Starting WAHA container with docker compose..."
docker compose -f docker-compose.prod.yaml up -d --force-recreate

# 8. Clean up unused images
docker image prune -f

echo "Deployment completed successfully!"
docker ps --filter "name=waha-noweb-light"
SCRIPT_EOF

          # Substitute variables safely
          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" /tmp/deploy.sh
          sed -i "s|__REGISTRY__|$REGISTRY|g" /tmp/deploy.sh
          sed -i "s|__ECR_PASSWORD__|$ECR_PASSWORD|g" /tmp/deploy.sh

          # Base64 encode the script to completely bypass quoting and newline issues
          B64_SCRIPT=$(base64 -w 0 /tmp/deploy.sh)

          # Send Command via AWS SSM using a single clean line
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64_SCRIPT | base64 -d | bash\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched: $COMMAND_ID"
          echo "Waiting for execution to finish on EC2..."

          # Wait for command completion (continue so we can print stdout/stderr)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" || true

          # Fetch execution details
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --output json)

          STATUS=$(echo "$INVOCATION" | jq -r '.Status // "Unknown"')
          echo "=========================================="
          echo "SSM Command Status: $STATUS"
          echo "=========================================="

          echo "=== EC2 Standard Output ==="
          echo "$INVOCATION" | jq -r '.StandardOutputContent // "No stdout"'

          echo "=== EC2 Standard Error ==="
          echo "$INVOCATION" | jq -r '.StandardErrorContent // "No stderr"'

          if [ "$STATUS" != "Success" ]; then
            echo "❌ SSM execution failed with status: $STATUS"
            exit 1
          fi
